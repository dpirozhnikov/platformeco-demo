info:
  name: def_ReadModel
  title: def_ReadModel
  version: 1.0.0
connector:
  id: http
  resource:
    path: '/models/:documentNumber'
    method: GET
    requestValidation: true
    responseValidation: false
    responsesSchema:
      - statusCode: '200'
        description: OK
        contentType: application/json
    querySchema: |-
      {
        "type": "object",
        "properties": {
          "documentNumber": {
            "default": "DOC123456",
            "type": "string"
          }
        },
        "required": [
          "documentNumber"
        ]
      }
    contentType: application/json
  skipParsing: false
  disableSynchronizationChanges: false
  queryArraySerializeMethod: default
flow:
  execute:
    - RedisGetKey:
        id: 16113330-1732-4e05-a099-4e04c3dd81ea
        key: '${request.query.documentNumber}'
        proceed-on-error: true
        title: Из кэша
        connector: ioredis
        output: redis_res
        timeout: 300000
        configurationType: UI
    - switch:
        title: Проверка
        id: 5e33ff69-7e98-495e-855f-357fb97d5b01
        case:
          - title: Есть ключ
            condition: redis_res
            execute:
              - function:
                  id: ca0fda33-d486-4fab-b3c0-e397b23632ff
                  name: to_json
                  title: В JSON
                  output: model
              - setResponse:
                  title: '[Set Response]'
                  description: '[Set response status, headers and body]'
                  id: 7dcd124f-221f-45f2-ba4c-443efbe451b2
                  configurationType: UI
                  status: '200'
                  doJsonStringify: true
                  sendReplyInstantly: false
                  terminateFlow: false
                  headers:
                    content-type: application/json
                  body: '${model}'
          - otherwise:
              - postgresql:
                  id: fad5bf99-3b5e-4328-b0d8-b29d6ca03a78
                  text: "SELECT\r\n    documentNumber, documentDate, documentSum, chargeAccount, depositAccount, description, status\r\nFROM\r\n    public.bssdemo\r\nWHERE\r\n    documentNumber = $1;"
                  paramsConfigurationType: UI
                  output: pg_res
                  parameters:
                    - type: String
                      value: '${request.query.documentNumber}'
                  title: Из БД
                  description: '[Execute PostgreSQL query]'
                  proceed-on-error: true
                  connectorID: postgres-connector
                  configurationType: UI
                  $meta:
                    dataModel:
                      $ref: pg_res
              - switch:
                  title: Проверка  PG
                  id: 4e3fd5eb-5702-4e1c-8d7e-fcecc673a3de
                  case:
                    - title: Есть модель
                      condition: pg_res.length
                      execute:
                        - RedisSetKey:
                            id: 0a0b67e0-8a95-4464-8b55-d3f113204146
                            key: '${request.query.documentNumber}'
                            value: '${JSON.stringify(pg_res[0])}'
                            expireTime: 180
                            expireTimeUnits: SECONDS
                            proceed-on-error: true
                            title: Запись в кэш
                            connector: ioredis
                            output: redis_res
                            timeout: 300000
                            configurationType: UI
                        - function:
                            id: 9abb3110-4ce3-4270-8e23-aa587ed6fc94
                            name: to_json_copy
                            title: В JSON
                            output: model
                        - setResponse:
                            title: '[Set Response]'
                            description: '[Set response status, headers and body]'
                            id: abfb5350-ab7e-4933-9dbe-8b8f1dc34e67
                            configurationType: UI
                            status: '200'
                            doJsonStringify: true
                            sendReplyInstantly: false
                            terminateFlow: false
                            headers:
                              content-type: application/json
                            body: '${model}'
                    - otherwise:
                        - raiseError:
                            title: '[Raise Error]'
                            description: '[Terminate flow with error]'
                            id: 258e235f-06bf-4cc5-a9a0-34e783ffda0c
                            configurationType: UI
                            status: '500'
                            message: Нет такого номера документа
                  otherwise: true
        otherwise: true
        $meta:
          dataModel:
            $ref: pg_res
documentationType: openapi3
documentation:
  paths:
    '/models/{documentNumber}':
      get:
        parameters:
          - name: documentNumber
            in: query
            required: true
            schema:
              type: string
              default: DOC123456
        responses:
          '200':
            description: OK
        summary: Чтение из кэша или базы для проверки
        description: Чтение из кэша или базы для проверки
  openapi: 3.0.0
id: f80ea299-e2a4-4d4d-94f2-6d9358eaa673
