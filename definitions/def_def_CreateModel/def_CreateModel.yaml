id: ed84148e-2e76-482e-bae6-ac2a0f788a70
info:
  name: def_CreateModel
  title: def_CreateModel
  version: 1.0.0
  description: Создание новой модели.
connector:
  id: http
  resource:
    path: /models
    method: POST
    requestValidation: true
    responseValidation: false
    responsesSchema:
      - statusCode: '200'
        description: OK
        contentType: application/json
      - statusCode: '400'
        description: Invalid input
        contentType: application/json
    contentType: application/json
    bodySchema: |-
      {
        "$ref": "data/initial_model"
      }
  skipParsing: false
  disableSynchronizationChanges: false
  queryArraySerializeMethod: default
flow:
  execute:
    - parallel:
        id: e0d81ec5-06fd-448d-bc0f-abcf345eeab2
        title: Валидация
        branches:
          - execute:
              - jsonSchema:
                  id: f63522f7-7df0-4282-9b88-58f67d60d8c1
                  schema: "{\r\n    \"type\": \"object\",\r\n    \"properties\": {\r\n      \"documentNumber\": {\r\n        \"type\": \"string\",\r\n        \"description\": \"Номер документа\"\r\n      },\r\n      \"documentDate\": {\r\n        \"type\": \"string\",\r\n        \"format\": \"date\",\r\n        \"description\": \"Дата документа\"\r\n      },\r\n      \"documentSum\": {\r\n        \"type\": \"number\",\r\n        \"description\": \"Сумма документа\",\r\n        \"pattern\": \"^[0-9]+(\\\\.[0-9]{1,4})?$\"\r\n      },\r\n      \"chargeAccount\": {\r\n        \"type\": \"string\",\r\n        \"pattern\": \".*-1$\",\r\n        \"description\": \"Счет списания\"\r\n      },\r\n      \"depositAccount\": {\r\n        \"type\": \"string\",\r\n        \"pattern\": \".*-1$\",\r\n        \"description\": \"Счет зачисления\"\r\n      },\r\n      \"description\": {\r\n        \"type\": \"string\",\r\n        \"description\": \"Описание перевода\"\r\n      }\r\n    },\r\n    \"required\": [\"documentNumber\", \"documentDate\", \"documentSum\", \"chargeAccount\", \"depositAccount\"]\r\n  }"
                  title: JSON схема
                  proceed-on-error: true
                  input: request.body
                  output: schema_res
                  configurationType: UI
            title: Schema
          - execute:
              - array-find:
                  id: df293a23-a6e8-4232-8ebd-1f8974368567
                  condition:
                    - notation: '==='
                      value: '${request.body.chargeAccount}'
                  output: charge_res
                  title: Счёт списания
                  input: config.acc_list
                  configurationType: UI
                  proceed-on-error: true
            title: chargeAccount in list
          - execute:
              - array-find:
                  id: e4cf280b-87c3-4acb-8d26-992d8f452a51
                  condition:
                    - notation: '==='
                      value: '${request.body.depositAccount}'
                  output: deposit_res
                  title: Счёт зачисления
                  input: config.acc_list
                  configurationType: UI
                  proceed-on-error: true
            title: depositAccount in list
    - switch:
        title: Присвоение статуса
        id: 2eef2cec-ec75-4096-8a7f-f544c623f3db
        case:
          - title: Корректная модель
            condition: deposit_res&&charge_res&&schema_res
            execute:
              - function:
                  title: status_ok
                  id: 7592eee3-4d10-4677-93ea-5fa0ff76e705
                  name: status_ok
                  output: statused_model
          - otherwise:
              - function:
                  title: status_error
                  id: 4eeb989b-b0d4-44d2-9359-d73074615ca4
                  name: status_error
                  output: statused_model
        otherwise: true
    - kafkaSend:
        id: 2d66a77f-ba37-4f34-8e4a-6be66503ec24
        topic: kafkareadtest
        transactional: false
        messages:
          - key: '${statused_model.documentNumber}'
            value: '${JSON.stringify(statused_model)}'
        key:
          configurationType: Raw
          dataType: String
        value:
          configurationType: Raw
          dataType: JSON
        title: Запись в Кафку
        connectorID: kafka-write
        configurationType: UI
        proceed-on-error: true
        output: kafka_res
    - setResponse:
        title: '[Set Response]'
        description: '[Set response status, headers and body]'
        id: daa61b79-e955-4f6f-a87e-81630576001e
        configurationType: UI
        status: '200'
        doJsonStringify: true
        sendReplyInstantly: false
        terminateFlow: false
        headers:
          content-Type: application/json
        body: '${statused_model}'
documentationType: openapi3
documentation:
  paths:
    /models:
      post:
        summary: Создание новой модели
        description: Создание новой модели.
        requestBody:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/initial_model'
        responses:
          '200':
            description: OK
          '400':
            description: Invalid input
        parameters: []
  openapi: 3.0.0
