info:
  name: def_UpdateModel
  title: def_UpdateModel
  version: 1.0.0
connector:
  id: http
  resource:
    path: '/models/:documentNumber'
    method: PUT
    requestValidation: true
    responseValidation: false
    responsesSchema:
      - statusCode: '200'
        description: OK
        contentType: application/json
    querySchema: |-
      {
        "type": "object",
        "properties": {
          "documentNumber": {
            "default": "DOC123456",
            "type": "string"
          }
        },
        "required": [
          "documentNumber"
        ]
      }
    contentType: application/json
    bodySchema: |-
      {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "default": "Доставлен (передан для дальнейшей обработки)",
            "enum": [
              "Доставлен (передан для дальнейшей обработки)",
              "Новый (сохранен без ошибок)",
              "Ошибка контроля (сохранен с ошибками контролей)"
            ]
          }
        },
        "required": [
          "status"
        ],
        "default": {
          "status": "Доставлен (передан для дальнейшей обработки)"
        }
      }
  skipParsing: false
  disableSynchronizationChanges: false
  queryArraySerializeMethod: default
flow:
  execute:
    - postgresql:
        id: da209d58-272a-419b-bab8-864f50bcca04
        text: "SELECT\r\n    documentNumber, documentDate, documentSum, chargeAccount, depositAccount, description, status\r\nFROM\r\n    public.bssdemo\r\nWHERE\r\n    documentNumber = $1;"
        paramsConfigurationType: UI
        output: pg_res
        parameters:
          - type: String
            value: '${request.query.documentNumber}'
        title: Модель из БД
        description: '[Execute PostgreSQL query]'
        proceed-on-error: true
        connectorID: postgres-connector
        configurationType: UI
    - switch:
        title: Проверка
        id: 83788d3d-687c-4921-b6b2-4ae124a66786
        case:
          - execute:
              - function:
                  id: 6ef776e4-56ba-4b10-b5ff-dcda9bacac8a
                  name: value_for_kafka
                  title: Статус для Кафки
                  output: val_for_kafka
              - kafkaSend:
                  id: 4aafd021-78bd-4668-acaf-6fbeb7ce65e5
                  topic: kafkareadtest
                  transactional: false
                  messages:
                    - key: '${request.query.documentNumber}'
                      value: '${JSON.stringify(val_for_kafka)}'
                  key:
                    configurationType: Raw
                    dataType: String
                  value:
                    configurationType: Raw
                    dataType: JSON
                  title: В Кафку
                  connectorID: kafka-write
                  configurationType: UI
                  proceed-on-error: true
                  output: kafka_res
              - setResponse:
                  id: a5a9583c-2bf6-423d-9924-6afffdd73c22
                  title: '[Set Response]'
                  description: '[Set response status, headers and body]'
                  configurationType: UI
                  status: '200'
                  doJsonStringify: false
                  sendReplyInstantly: false
                  terminateFlow: false
            condition: pg_res.length
            title: Есть модель
          - otherwise:
              - raiseError:
                  title: '[Raise Error]'
                  description: '[Terminate flow with error]'
                  id: 327a3dd1-9533-4c71-864f-911dff4b7a60
                  configurationType: UI
                  status: '500'
                  message: Нет модели с таким номером документа
        otherwise: true
documentationType: openapi3
documentation:
  openapi: 3.0.0
  paths:
    '/models/{documentNumber}':
      put:
        parameters:
          - in: query
            name: documentNumber
            required: true
            schema:
              default: DOC123456
              type: string
        responses:
          '200':
            description: OK
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    default: Доставлен (передан для дальнейшей обработки)
                    enum:
                      - Доставлен (передан для дальнейшей обработки)
                      - Новый (сохранен без ошибок)
                      - Ошибка контроля (сохранен с ошибками контролей)
                required:
                  - status
                default:
                  status: Доставлен (передан для дальнейшей обработки)
id: 15f9f531-4d57-4c05-9bf7-ee926ad5ba57
